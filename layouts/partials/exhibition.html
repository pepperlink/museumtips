<article>
  <h3><a href="{{ .url }}">{{ .title }}</a></h3>
  <p>
    <strong>{{ .museum }}</strong>, {{ .city -}}
    {{- $dates := partial "format-date.html" . -}}
    {{- $count := partial "countdown.html" . -}}
    {{- if or $dates $count }}
    <br>{{ $dates -}}
    {{- with $count -}}
      {{- if $dates }} · {{ end -}}<strong>{{ . }}</strong>
    {{- end -}}
    {{- end }}
  </p>
  {{ with .description }}
  <p>{{ . }}</p>
  {{ end }}
</article>
